<!doctype html>
<html lang="ar" dir="rtl" data-skin="pro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>كتابي</title>
<meta name="description" content="كتاب العلوم بين يديك: تشرح عليه بالقلم، ولكل درس أهداف وشرح ورسوم وخرائط مفاهيم وتقويم، وخطة الدروس على أسابيع الفصل.">
<meta name="theme-color" content="#F2F3F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#2E3137" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="كتابي">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<script>window.KITABI_VERSION = '2026.11.03.5';
try { var pf = JSON.parse(localStorage.getItem('kitabi-pref') || '{}') || {}; if (pf.theme === 'light' || pf.theme === 'dark') document.documentElement.setAttribute('data-theme', pf.theme); } catch (e) {}</script>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app" id="app" dir="rtl" lang="ar">
  <header class="top">
    <div class="top-in">
      <div class="brand">
        <div><b>كتابي</b><p class="ptitle" id="ptitle" role="heading" aria-level="1"></p></div>
      </div>
      <div id="top-meta"></div>
    </div>
    <div class="cstrip" id="cstrip"></div>
  </header>
  <main class="wrap" id="main"><p class="muted">جارٍ التحميل…</p></main>
  <script>/* if the app has not started after a while (a file did not arrive), offer to load it again */
  setTimeout(function () { var m = document.getElementById('main'); if (!m || !/جارٍ التحميل/.test(m.textContent)) return;
    m.innerHTML = '<section class="panel" style="margin-top:20px"><h2>يتأخر فتح التطبيق</h2><p class="muted">ربما لم يكتمل تنزيل ملفات التحديث. بياناتك محفوظة على الجهاز ولن تتأثر.</p><div class="actions"><button class="btn" id="boot-retry">أعد المحاولة</button><button class="btn ghost" id="boot-fix">نزّل التطبيق من جديد</button></div></section>';
    document.getElementById('boot-retry').onclick = function () { location.reload(); };
    document.getElementById('boot-fix').onclick = function () { var p = Promise.resolve(); if (window.caches) p = caches.keys().then(function (k) { return Promise.all(k.filter(function (x) { return x.indexOf('kitabi-') === 0; }).map(function (x) { return caches.delete(x); })); }); if (navigator.serviceWorker) p = p.then(function () { return navigator.serviceWorker.getRegistrations(); }).then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }); p.catch(function () {}).then(function () { location.reload(); }); };
  }, 15000);</script>
  <nav class="tabs" id="tabs" aria-label="أقسام التطبيق" hidden><div class="tabs-in">
    <button class="tab" data-act="go" data-to="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10.6 12 4l8 6.6V19a1.6 1.6 0 0 1-1.6 1.6H15v-5.4H9v5.4H5.6A1.6 1.6 0 0 1 4 19z"/></svg><span>الرئيسية</span></button>
    <button class="tab" data-act="go" data-to="lessons"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12"/><path d="M4 6h.01M4 12h.01M4 18h.01"/></svg><span>الدروس</span></button>
    <button class="tab" data-act="go" data-to="read"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.8 5.6c2.7-1.1 5.6-1 8.2.6 2.6-1.6 5.5-1.7 8.2-.6v13.2c-2.7-1-5.6-.9-8.2.7-2.6-1.6-5.5-1.7-8.2-.7z"/><path d="M12 6.2v13.3"/></svg><span>الكتاب</span></button>
    <button class="tab" data-act="go" data-to="quiz"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.6"/><path d="M9.5 9.4a2.6 2.6 0 1 1 3.6 2.4c-.7.3-1.1.8-1.1 1.5v.5"/><path d="M12 16.9v.1"/></svg><span>الأسئلة</span></button>
    <button class="tab" data-act="go" data-to="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.6" y="5" width="16.8" height="15.2" rx="3"/><path d="M3.6 10h16.8M8 3v4M16 3v4"/></svg><span>التقويم</span></button>
  </div></nav>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <div class="modal" id="modal" hidden></div>
  <div class="pv" id="pv" hidden></div>
</div>
<script src="app.js"></script>
</body>
</html>
