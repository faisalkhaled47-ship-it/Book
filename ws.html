<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>ورقة العمل</title>
<style>
@page{size:A4;margin:0}
html,body{margin:0;background:#e9ecea;font-family:system-ui,-apple-system,"Geeza Pro",sans-serif}
.bar{position:sticky;top:0;z-index:5;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px;background:#0f5257;color:#fff;font-size:14px}
.bar button{font:inherit;font-weight:700;border:0;border-radius:999px;padding:10px 18px;background:#fff;color:#0f5257;cursor:pointer}
.bar p{margin:0;max-width:640px;line-height:1.6}
.sheet{padding:12px 0}
.err{padding:30px;text-align:center;color:#8a1c1c}
@media screen and (max-width:860px){.sheet .ws-root{zoom:.9}}@media screen and (max-width:760px){.sheet .ws-root{zoom:.8}}@media screen and (max-width:660px){.sheet .ws-root{zoom:.7}}@media screen and (max-width:560px){.sheet .ws-root{zoom:.6}}@media screen and (max-width:470px){.sheet .ws-root{zoom:.5}}@media screen and (max-width:400px){.sheet .ws-root{zoom:.44}}
@media print{html,body{background:#fff}.bar{display:none}.sheet{padding:0}}
</style>
</head>
<body>
<div class="bar"><button type="button" id="go">اطبع أو احفظ PDF</button><button type="button" id="back" hidden>ارجع إلى كتابي</button><p>في نافذة الطباعة: اختر الطابعة، أو اضغط زر المشاركة أعلاها ثم «حفظ في الملفات» لتحفظها PDF.</p></div>
<div class="sheet" id="sheet"></div>
<script>
(function () {
  // the sheet came in the address after # (never sent to a server); it is HTML and CSS only, cleaned by the app
  var sheet = document.getElementById('sheet');
  try {
    var h = location.hash.slice(1).replace(/-/g, '+').replace(/_/g, '/'); while (h.length % 4) h += '=';
    var bin = atob(h), bytes = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    var d = JSON.parse(new TextDecoder().decode(bytes));
    document.title = d.t || document.title;
    var st = document.createElement('style'); st.textContent = d.css; document.head.appendChild(st);
    var tpl = document.createElement('template'); tpl.innerHTML = d.html;
    Array.prototype.forEach.call(tpl.content.querySelectorAll('script,iframe,object,embed,link,meta,base,form'), function (n) { n.remove(); });
    Array.prototype.forEach.call(tpl.content.querySelectorAll('*'), function (n) { Array.prototype.slice.call(n.attributes).forEach(function (a) { if (/^on/i.test(a.name) || (/^(src|href|xlink:href|action)$/i.test(a.name) && !/^(data:image\/|#)/i.test(a.value))) n.removeAttribute(a.name); }); });
    sheet.appendChild(tpl.content);
    history.replaceState(null, '', location.pathname); // the sheet does not stay in the address or the history
    setTimeout(function () { try { window.print(); } catch (e) {} }, 600);
  } catch (e) { sheet.innerHTML = '<p class="err">تعذّر فتح الورقة. ارجع إلى التطبيق واضغط «اطبع أو احفظ PDF» مرة أخرى.</p>'; }
  document.getElementById('go').addEventListener('click', function () { window.print(); });
  var standalone = window.navigator.standalone || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
  if (standalone || !window.opener) { var bk = document.getElementById('back'); bk.hidden = false; bk.addEventListener('click', function () { if (window.opener) window.close(); else location.href = './'; }); }
})();
</script>
</body>
</html>
